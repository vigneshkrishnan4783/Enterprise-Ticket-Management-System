name: Enterprise Ticket Management System CI/CD

on:
  push:
    branches:
      - main
      - 'FR-*'
      - 'feature/*'
      - 'ci-cd-pipeline'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-verify:
    name: Build, Test & Quality Gate (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Verify JDK and Maven Environment
        run: |
          java -version
          mvn -v

      - name: Compile and Validate Code Standards
        run: mvn clean compile -B

      - name: Verify Code Style & Spotless Formatting
        run: mvn spotless:check -B

      - name: Run Automated Unit Tests
        run: mvn test -B

      - name: Package Spring Boot Executable Artifact
        run: mvn package -DskipTests=true -B

      - name: Verify Liquibase Master Migration Integrity
        run: |
          test -f src/main/resources/db.changelog/db.changelog-master.yaml || exit 1
